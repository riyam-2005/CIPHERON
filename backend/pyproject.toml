[project]
name = "cipheron-x1-backend"
version = "1.0.0"
description = "CIPHERON-X1 Companion Analysis Server Subsystem"
authors = [{ name = "CIPHERON Team", email = "research@cipheron.local" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
