version: '3.8'

services:
  companion-backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY pyproject.toml README.md ./
        COPY app ./app
        RUN pip install --no-cache-dir .
        EXPOSE 8000
        CMD ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - CURRENT_SECURITY_PROFILE=STANDARD
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  web-dashboard:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build

        FROM nginx:alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
    ports:
      - "3000:80"
    depends_on:
      - companion-backend
    restart: unless-stopped
